spring.application.name=shopsphere-api

# --- PostgreSQL datasource (P1-T04) ---
# All values are environment-driven; defaults match the local PostgreSQL
# service provisioned by docker-compose.yml (P1-T03). When running the
# application directly on the host, DB_HOST defaults to localhost. When
# the application is later containerized on shopsphere-network, DB_HOST
# should be set to the Docker service name "postgres".
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopsphere}
spring.datasource.username=${DB_USERNAME:shopsphere}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
# Default migration location (classpath:db/migration) and default
# enablement are used deliberately; no custom Flyway behavior is
# introduced in this ticket.
spring.flyway.enabled=true

# --- Server (P1-T05) ---
server.port=${SERVER_PORT:8080}

# --- JPA (P1-T05) ---
# Flyway owns the schema; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator (P1-T05, extended in P1-T09) ---
# Exposed: health, info, metrics, prometheus. Nothing else (no env, beans,
# heapdump, ...). health and info are public; metrics and prometheus require
# HTTP Basic credentials (see ActuatorSecurityConfig). Health shows only the
# status of each component (db, redis, ...), never details.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always
management.info.env.enabled=false
info.app.name=shopsphere-api
info.app.description=ShopSphere backend API
# Credentials for Prometheus scraping. There is NO default password: without
# ACTUATOR_PASSWORD, metrics and prometheus stay locked (401 for everyone).
app.security.actuator.username=${ACTUATOR_USERNAME:prometheus}
app.security.actuator.password=${ACTUATOR_PASSWORD:}

# --- Metrics (P1-T09) ---
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2s

# --- Logging (P1-T09) ---
# Console: human-readable, with a per-request id. File: JSON (ECS) for later
# log ingestion, rotated by size and age.
logging.level.root=INFO
logging.level.com.shopsphere=INFO
logging.pattern.level=%5p [%X{requestId:-}]
logging.file.name=${LOG_DIR:logs}/shopsphere-api.log
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB

# --- Security / JWT (P1-T06) ---
# JWT_SECRET has no default on purpose: the app refuses to start without a
# secret of at least 32 characters. Never commit a real value.
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:shopsphere-api}
app.security.jwt.expiration=${JWT_EXPIRATION:15m}
# Comma-separated list of allowed browser origins; empty = no cross-origin access.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Redis & caching (P1-T08) ---
# Host/port come from SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT (defaults
# match the local docker-compose Redis). Redis is a cache only: Lettuce connects
# lazily, so the app still starts without Redis and runs in degraded mode
# (cache calls are logged and skipped). Short timeouts keep requests from hanging.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.cache.type=redis
# Default TTL for every cache; per-cache overrides use app.cache.ttls.<cacheName>.
app.cache.default-ttl=10m
app.cache.ttls.demo=5m
