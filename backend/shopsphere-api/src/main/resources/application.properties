spring.application.name=shopsphere-api

# --- PostgreSQL datasource (P1-T04) ---
# All values are environment-driven; defaults match the local PostgreSQL
# service provisioned by docker-compose.yml (P1-T03). When running the
# application directly on the host, DB_HOST defaults to localhost. When
# the application is later containerized on shopsphere-network, DB_HOST
# should be set to the Docker service name "postgres".
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopsphere}
spring.datasource.username=${DB_USERNAME:shopsphere}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway ---
# Default migration location (classpath:db/migration) and default
# enablement are used deliberately; no custom Flyway behavior is
# introduced in this ticket.
spring.flyway.enabled=true
